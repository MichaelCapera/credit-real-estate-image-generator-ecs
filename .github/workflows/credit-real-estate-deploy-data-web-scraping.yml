name: Deploy Image Generator ECS

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: "us-east-1"
      ECR_REPOSITORY: "credit-real-estate-img-repo"
      ECS_CLUSTER: "credit-real-estate-img-cluster"
      ECS_TASK_DEFINITION: "credit-real-estate-img-task"
      PROJECT_NAME: "credit-real-estate-img"

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Fetch Dynamic Network Configuration
      id: fetch-network
      run: |
        # Query the specific Security Group created by Terraform for this project
        SG_ID=$(aws ec2 describe-security-groups \
          --filters "Name=group-name,Values=${{ env.PROJECT_NAME }}-fargate-sg" \
          --query "SecurityGroups[0].GroupId" \
          --output text)
        
        # Query default public subnets (filtering the ones mapping public IPs on launch)
        SUBNET_IDS=$(aws ec2 describe-subnets \
          --filters "Name=map-public-ip-on-launch,Values=true" \
          --query "Subnets[*].SubnetId" \
          --output json | jq -c '.')

        echo "sg_id=$SG_ID" >> $GITHUB_OUTPUT
        echo "subnets=$SUBNET_IDS" >> $GITHUB_OUTPUT

    - name: Run ECS Task
      id: run-task
      run: |
        # Execute the task dynamically inside the true cluster and network context
        TASK_ARN=$(aws ecs run-task \
          --cluster ${{ env.ECS_CLUSTER }} \
          --task-definition ${{ env.ECS_TASK_DEFINITION }} \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=${{ steps.fetch-network.outputs.subnets }},assignPublicIp=ENABLED,securityGroups=[\"${{ steps.fetch-network.outputs.sg_id }}\"]}" \
          --query 'tasks[0].taskArn' \
          --output text)
        echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
        echo "Task ARN: $TASK_ARN"

    - name: Wait for task to complete
      run: |
        aws ecs wait tasks-stopped \
          --cluster ${{ env.ECS_CLUSTER }} \
          --tasks ${{ steps.run-task.outputs.task_arn }}
        echo "Task completed successfully"